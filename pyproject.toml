[project]
name = "ai-censur"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SunilS97", email = "111933521+SunilS97@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "better-profanity>=0.7.0",
    "fastapi[all]>=0.143.3",
    "greenlet>=3.5.6",
    "passlib[argon2]>=1.7.4",
    "pydantic-settings>=2.16.0",
    "pydub>=0.25.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "scalar-fastapi>=1.9.1",
    "sqlmodel>=0.0.48",
    "whisperx>=3.8.6",
]

[project.scripts]
ai-censur = "ai_censur:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "ruff>=0.17.1",
]
